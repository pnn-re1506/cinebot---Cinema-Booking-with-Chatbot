spring:
  application:
    name: cinebot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinebot}
    username: ${DB_USER:cinebot}
    password: ${DB_PASSWORD:cinebot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

cinebot:
  jwt-secret: ${JWT_SECRET:}
  frontend-origin: ${APP_PUBLIC_URL:http://localhost:5173}
  api-public-url: ${API_PUBLIC_URL:http://localhost:8080}
  cinema-timezone: ${CINEMA_TIMEZONE:Asia/Ho_Chi_Minh}
  demo-mode: ${DEMO_MODE:false}
  payment-providers-enabled: ${PAYMENT_PROVIDERS_ENABLED:MOCK}
  mail-from: ${MAIL_FROM:noreply@cinebot.local}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  rate-limits:
    login:
      capacity: 10
      period: PT1M
    register:
      capacity: 5
      period: PT1M
    booking-lookup:
      capacity: 5
      period: PT1M
    hold-create:
      capacity: 20
      period: PT1M

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    out-of-order: true
cinebot:
  jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-not-for-production}
  payment-providers-enabled: ${PAYMENT_PROVIDERS_ENABLED:MOCK}
