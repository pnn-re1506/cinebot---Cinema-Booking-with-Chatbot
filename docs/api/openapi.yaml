components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 min, kept in memory by the client). Claims `sub`, `role`, `exp`, `jti`.
    bookingToken:
      type: apiKey
      in: header
      name: X-Booking-Token
      description: Random token returned by `createBooking`; grants access to that booking only.
    refreshCookie:
      type: apiKey
      in: cookie
      name: cb_refresh
      description: Opaque refresh token. `HttpOnly; Secure; SameSite=Strict; Path=/api/auth`; 7 days.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Locale'
    ClientId:
      name: X-Client-Id
      in: header
      required: true
      description: Random UUID persisted by the browser; scopes "one active hold" for guests (BR-10). Not a credential.
      schema:
        type: string
        format: uuid
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-based auth endpoints
      schema:
        type: string
        const: XMLHttpRequest
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    ShowtimeId:
      name: showtimeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MovieId:
      name: movieId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SnackId:
      name: snackId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 0-based page index
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED` with `fieldErrors`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: VALIDATION_FAILED
            fieldErrors:
              - field: phone
                code: Pattern
    Unauthenticated:
      description: '`UNAUTHENTICATED`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`FORBIDDEN` (wrong role / not the owner) or `BOOKING_TOKEN_INVALID`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidState:
      description: '`INVALID_STATE` (action not allowed in the current booking/showtime state)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HoldExpired:
      description: '`HOLD_EXPIRED`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceInUse:
      description: '`RESOURCE_IN_USE`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SeedProtected:
      description: '`SEED_PROTECTED` (BR-26)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SeatServiceUnavailable:
      description: '`SEAT_SERVICE_UNAVAILABLE` (Redis unavailable, `ARCHITECTURE.md` §6.8)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthSuccess:
      description: Access token + profile. The refresh cookie is set via `Set-Cookie`.
      headers:
        Set-Cookie:
          description: '`cb_refresh=…; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'

  schemas:
    # ---------------------------------------------------------------- enums
    Locale:
      type: string
      enum: [vi, en]
      default: vi
    ErrorCode:
      type: string
      description: Stable error codes (`ARCHITECTURE.md` §9.2). Clients translate them via `errors:<CODE>`.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - TOKEN_REUSED
        - FORBIDDEN
        - BOOKING_TOKEN_INVALID
        - NOT_FOUND
        - EMAIL_TAKEN
        - SEAT_UNAVAILABLE
        - SHOWTIME_OVERLAP
        - INVALID_STATE
        - RESOURCE_IN_USE
        - HOLD_EXPIRED
        - ORPHAN_SEAT
        - TICKET_COUNT_MISMATCH
        - BOOKING_TOO_LARGE
        - SALES_CLOSED
        - NOT_BOOKABLE
        - CUSTOMER_INFO_REQUIRED
        - SEED_PROTECTED
        - RATE_LIMITED
        - SEAT_SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    MovieStatus:
      type: string
      enum: [NOW_SHOWING, COMING_SOON, ENDED]
    AgeRating:
      type: string
      enum: [P, K, T13, T16, T18]
    DayType:
      type: string
      enum: [DISCOUNT_DAY, WEEKDAY, WEEKEND]
    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    SeatType:
      type: string
      enum: [SINGLE, COUPLE]
    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, HELD_BY_YOU, SOLD, BLOCKED]
    TicketType:
      type: string
      enum: [ADULT, STUDENT, COUPLE]
    BookingStatus:
      type: string
      enum: [HOLDING, PENDING_PAYMENT, CONFIRMED, EXPIRED, RELEASED, NEEDS_ATTENTION, REFUNDED]
    Channel:
      type: string
      enum: [WEB, CHAT, KIOSK, ADMIN]
    PaymentProvider:
      type: string
      enum: [VNPAY, MOCK]
    PaymentStatus:
      type: string
      enum: [INITIATED, SUCCEEDED, FAILED, EXPIRED]
    TicketStatus:
      type: string
      enum: [VALID, CHECKED_IN, VOID]
    Role:
      type: string
      enum: [CUSTOMER, STAFF, ADMIN]
    ShowtimeAvailability:
      type: string
      description: ALMOST_FULL when fewer than 10% of seat units are left (DESIGN §6.2)
      enum: [AVAILABLE, ALMOST_FULL, SOLD_OUT, SALES_CLOSED]
    LedgerType:
      type: string
      enum: [EARN, REVERSAL, ADJUST]
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Amount in VND

    # ---------------------------------------------------------------- errors
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Developer-oriented; never shown to users
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        seatIds:
          type: array
          description: Seats involved (`SEAT_UNAVAILABLE`, `ORPHAN_SEAT`)
          items:
            type: integer
            format: int64
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON path of the invalid field, e.g. `items[0].quantity`
        code:
          type: string
          description: Bean Validation constraint name, e.g. `NotBlank`, `Size`, `Pattern`, `Email`, `Min`, `Max`

    # ---------------------------------------------------------------- shared
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    RoomRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Genre:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
          description: In the requested language

    # ---------------------------------------------------------------- catalogue
    MovieSummary:
      type: object
      required: [id, slug, title, originalTitle, status, ageRating, durationMin, genres, countryCode, audioLanguage, releaseDate, posterUrl, synopsis, directors]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
          description: In the requested language (fallback vi)
        originalTitle:
          type: string
        status:
          $ref: '#/components/schemas/MovieStatus'
        ageRating:
          $ref: '#/components/schemas/AgeRating'
        durationMin:
          type: integer
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        audioLanguage:
          type: string
          description: ISO 639-1
        subtitleLanguage:
          type: [string, 'null']
          description: ISO 639-1
        releaseDate:
          type: string
          format: date
        posterUrl:
          type: string
        backdropUrl:
          type: [string, 'null']
        trailerYoutubeId:
          type: [string, 'null']
        synopsis:
          type: string
        directors:
          type: array
          items:
            type: string
    MovieDetail:
      allOf:
        - $ref: '#/components/schemas/MovieSummary'
        - type: object
          required: [cast]
          properties:
            cast:
              type: array
              items:
                type: string
    MovieRef:
      type: object
      required: [id, slug, title, ageRating, durationMin, posterUrl]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        ageRating:
          $ref: '#/components/schemas/AgeRating'
        durationMin:
          type: integer
        posterUrl:
          type: string
        backdropUrl:
          type: [string, 'null']
    Cinema:
      type: object
      required: [name, address, phone, timezone, openingHours, demoMode, rooms]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
        openingHours:
          type: string
          description: Display text, e.g. `08:30 – 24:00`
        mapUrl:
          type: [string, 'null']
        demoMode:
          type: boolean
          description: Shows the demo banner and admin demo credentials
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/CinemaRoom'
    CinemaRoom:
      type: object
      required: [id, name, singleSeats, coupleSeats, capacityPeople]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        singleSeats:
          type: integer
        coupleSeats:
          type: integer
        capacityPeople:
          type: integer
          description: singleSeats + 2 × coupleSeats
    Snack:
      type: object
      required: [id, code, name, isCombo, price, discountedPrice, discountPct]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
        isCombo:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'
        discountedPrice:
          $ref: '#/components/schemas/Money'
        discountPct:
          type: integer
          description: 0 unless the caller is VIP (BR-19)

    # ---------------------------------------------------------------- showtimes
    MovieShowtimes:
      type: object
      required: [movieSlug, from, days]
      properties:
        movieSlug:
          type: string
        from:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/ShowtimeDay'
    ShowtimeDay:
      type: object
      required: [date, showtimes]
      properties:
        date:
          type: string
          format: date
        showtimes:
          type: array
          description: Ordered by start time; the client groups them by room
          items:
            $ref: '#/components/schemas/ShowtimeSlot'
    ShowtimeSlot:
      type: object
      required: [id, startsAt, endsAt, room, dayType, seatsLeft, totalSeats, availability]
      properties:
        id:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        room:
          $ref: '#/components/schemas/RoomRef'
        dayType:
          $ref: '#/components/schemas/DayType'
        seatsLeft:
          type: integer
          description: Active seat units neither sold nor held (single or couple seat = 1 unit)
        totalSeats:
          type: integer
          description: Active seat units of the room
        availability:
          $ref: '#/components/schemas/ShowtimeAvailability'
    TicketPrices:
      type: object
      required: [adult, student, couple]
      properties:
        adult:
          $ref: '#/components/schemas/Money'
        student:
          $ref: '#/components/schemas/Money'
        couple:
          $ref: '#/components/schemas/Money'
    ShowtimeDetail:
      type: object
      required: [id, status, startsAt, endsAt, salesOpen, dayType, room, movie, prices, holdMinutes, maxSeatUnits]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [SCHEDULED, CANCELLED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        salesOpen:
          type: boolean
          description: SCHEDULED, movie bookable and not started (BR-23, BR-24)
        dayType:
          $ref: '#/components/schemas/DayType'
        room:
          $ref: '#/components/schemas/RoomRef'
        movie:
          $ref: '#/components/schemas/MovieRef'
        prices:
          $ref: '#/components/schemas/TicketPrices'
        holdMinutes:
          type: integer
        maxSeatUnits:
          type: integer
          const: 8
    SeatMap:
      type: object
      required: [showtimeId, inventoryAvailable, columns, rows]
      properties:
        showtimeId:
          type: integer
          format: int64
        inventoryAvailable:
          type: boolean
          description: false when Redis is unavailable; HELD statuses are then unknown and holds cannot be created
        columns:
          type: integer
          description: Grid width in single-seat columns (the widest row)
        rows:
          type: array
          description: Front (screen side) to back
          items:
            $ref: '#/components/schemas/SeatRow'
    SeatRow:
      type: object
      required: [label, seatType, seats]
      properties:
        label:
          type: string
          examples: [A]
        seatType:
          $ref: '#/components/schemas/SeatType'
        seats:
          type: array
          description: Ordered by seat number (left to right)
          items:
            $ref: '#/components/schemas/Seat'
    Seat:
      type: object
      required: [id, label, number, col, seatType, status]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
          examples: [A5]
        number:
          type: integer
        col:
          type: integer
          description: 0-based start column in the grid; a couple seat spans 2 columns
        seatType:
          $ref: '#/components/schemas/SeatType'
        status:
          $ref: '#/components/schemas/SeatStatus'

    # ---------------------------------------------------------------- bookings
    TicketQuantities:
      type: object
      required: [adult, student, couple]
      properties:
        adult:
          type: integer
          minimum: 0
          maximum: 8
        student:
          type: integer
          minimum: 0
          maximum: 8
        couple:
          type: integer
          minimum: 0
          maximum: 8
    CreateBookingRequest:
      type: object
      required: [showtimeId, quantities, seatIds]
      properties:
        showtimeId:
          type: integer
          format: int64
        quantities:
          $ref: '#/components/schemas/TicketQuantities'
        seatIds:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: integer
            format: int64
    CreateBookingResponse:
      type: object
      required: [booking, bookingToken]
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        bookingToken:
          type: string
          description: Returned only once; send as `X-Booking-Token`
    BookingShowtime:
      type: object
      required: [id, startsAt, endsAt, dayType, room, movie]
      properties:
        id:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        dayType:
          $ref: '#/components/schemas/DayType'
        room:
          $ref: '#/components/schemas/RoomRef'
        movie:
          $ref: '#/components/schemas/MovieRef'
    BookingSeat:
      type: object
      required: [seatId, label, rowLabel, seatNumber, seatType, ticketType, admits, unitPrice]
      properties:
        seatId:
          type: integer
          format: int64
        label:
          type: string
        rowLabel:
          type: string
        seatNumber:
          type: integer
        seatType:
          $ref: '#/components/schemas/SeatType'
        ticketType:
          $ref: '#/components/schemas/TicketType'
        admits:
          type: integer
          enum: [1, 2]
        unitPrice:
          $ref: '#/components/schemas/Money'
    BookingSnack:
      type: object
      required: [snackId, code, name, quantity, unitPrice, discountPct, discountedUnitPrice, lineTotal]
      properties:
        snackId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: '#/components/schemas/Money'
        discountPct:
          type: integer
        discountedUnitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
    BookingTotals:
      type: object
      description: total = ticketSubtotal + snackSubtotal − snackDiscount (`shared/fixtures/pricing-cases.json`)
      required: [ticketSubtotal, snackSubtotal, snackDiscount, total]
      properties:
        ticketSubtotal:
          $ref: '#/components/schemas/Money'
        snackSubtotal:
          $ref: '#/components/schemas/Money'
          description: Σ unitPrice × quantity (before discount)
        snackDiscount:
          $ref: '#/components/schemas/Money'
          description: Σ (unitPrice − discountedUnitPrice) × quantity
        total:
          $ref: '#/components/schemas/Money'
    Customer:
      type: object
      required: [fullName, phone, email]
      properties:
        fullName:
          type: string
        phone:
          type: string
          description: Masked (e.g. `090****567`) in lookup results
        email:
          type: string
          format: email
    PaymentRef:
      type: object
      required: [id, provider, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time
    Booking:
      type: object
      required: [id, code, status, channel, locale, memberBooking, showtime, seats, snacks, totals, holdExpiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{8}$'
          description: 8 characters, Crockford base32
        status:
          $ref: '#/components/schemas/BookingStatus'
        channel:
          $ref: '#/components/schemas/Channel'
        locale:
          $ref: '#/components/schemas/Locale'
        memberBooking:
          type: boolean
          description: Made while logged in; only member bookings earn points (BR-16)
        showtime:
          $ref: '#/components/schemas/BookingShowtime'
        seats:
          type: array
          description: Sorted by row, then seat number (BR-06)
          items:
            $ref: '#/components/schemas/BookingSeat'
        snacks:
          type: array
          items:
            $ref: '#/components/schemas/BookingSnack'
        customer:
          oneOf:
            - $ref: '#/components/schemas/Customer'
            - type: 'null'
        totals:
          $ref: '#/components/schemas/BookingTotals'
        holdExpiresAt:
          type: string
          format: date-time
        pointsEarned:
          type: [integer, 'null']
          description: Set once confirmed for member bookings
        latestPayment:
          oneOf:
            - $ref: '#/components/schemas/PaymentRef'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
    SnackLineInput:
      type: object
      required: [snackId, quantity]
      properties:
        snackId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 10
    ReplaceSnacksRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          description: Each snackId at most once; inactive snacks are rejected (VALIDATION_FAILED)
          items:
            $ref: '#/components/schemas/SnackLineInput'
    CustomerInput:
      type: object
      required: [fullName, phone, email]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          description: Vietnamese mobile number
          pattern: '^(0|\+84)(3|5|7|8|9)[0-9]{8}$'
        email:
          type: string
          format: email
          maxLength: 254
    StartPaymentRequest:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/PaymentProvider'
    PaymentInit:
      type: object
      required: [paymentId, provider, redirectUrl, expiresAt]
      properties:
        paymentId:
          type: integer
          format: int64
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        redirectUrl:
          type: string
          description: Absolute VNPay URL, or the relative Demo Pay route `/pay/mock/{paymentId}`
        expiresAt:
          type: string
          format: date-time
          description: Equals the hold expiry (BR-11)
    Ticket:
      type: object
      required: [id, seatLabel, seatType, ticketType, admits, qrToken, status]
      properties:
        id:
          type: integer
          format: int64
        seatLabel:
          type: string
        seatType:
          $ref: '#/components/schemas/SeatType'
        ticketType:
          $ref: '#/components/schemas/TicketType'
        admits:
          type: integer
          enum: [1, 2]
        qrToken:
          type: string
          description: Opaque; rendered as a QR code by the client
        status:
          $ref: '#/components/schemas/TicketStatus'
    TicketList:
      type: object
      required: [bookingId, bookingCode, tickets]
      properties:
        bookingId:
          type: string
          format: uuid
        bookingCode:
          type: string
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    LookupRequest:
      type: object
      required: [code, contact]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
        contact:
          type: string
          description: Email or phone used for the booking
          minLength: 3
          maxLength: 254
    LookupResult:
      type: object
      required: [booking, tickets]
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        tickets:
          type: array
          description: Empty unless CONFIRMED
          items:
            $ref: '#/components/schemas/Ticket'

    # ---------------------------------------------------------------- payments
    VnpayIpnAck:
      type: object
      required: [RspCode, Message]
      properties:
        RspCode:
          type: string
          enum: ['00', '01', '02', '04', '97', '99']
        Message:
          type: string
    MockPaymentInfo:
      type: object
      required: [paymentId, bookingId, bookingCode, amount, status, expiresAt]
      properties:
        paymentId:
          type: integer
          format: int64
        bookingId:
          type: string
          format: uuid
        bookingCode:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        expiresAt:
          type: string
          format: date-time
    MockPaymentOutcome:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]

    # ---------------------------------------------------------------- auth & account
    RegisterRequest:
      type: object
      required: [email, password, fullName, phone]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least one letter and one digit
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^(0|\+84)(3|5|7|8|9)[0-9]{8}$'
        preferredLocale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds (900)
        user:
          $ref: '#/components/schemas/Me'
    Me:
      type: object
      required: [id, email, fullName, phone, preferredLocale, role, isVip]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        preferredLocale:
          $ref: '#/components/schemas/Locale'
        role:
          $ref: '#/components/schemas/Role'
        isVip:
          type: boolean
        vipUntil:
          type: [string, 'null']
          format: date-time
    UpdateMeRequest:
      type: object
      required: [fullName, phone, preferredLocale]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^(0|\+84)(3|5|7|8|9)[0-9]{8}$'
        preferredLocale:
          $ref: '#/components/schemas/Locale'
    MyBookingItem:
      type: object
      required: [id, code, status, startsAt, movie, room, seatLabels, total]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        startsAt:
          type: string
          format: date-time
        movie:
          $ref: '#/components/schemas/MovieRef'
        room:
          $ref: '#/components/schemas/RoomRef'
        seatLabels:
          type: array
          items:
            type: string
        total:
          $ref: '#/components/schemas/Money'
    MyBookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MyBookingItem'
    LedgerEntry:
      type: object
      required: [id, type, points, earnedAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/LedgerType'
        points:
          type: integer
          description: Negative for reversals
        bookingCode:
          type: [string, 'null']
        earnedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [qualifyingPoints, vipThresholdPoints, pointsToVip, isVip, pointsRatePct, vipSnackDiscountPct, ledger]
      properties:
        qualifyingPoints:
          type: integer
          description: BR-17 (`shared/fixtures/membership-cases.json`)
        vipThresholdPoints:
          type: integer
        pointsToVip:
          type: integer
          description: max(0, threshold − qualifyingPoints)
        isVip:
          type: boolean
        vipSince:
          type: [string, 'null']
          format: date-time
        vipUntil:
          type: [string, 'null']
          format: date-time
        pointsRatePct:
          type: integer
        vipSnackDiscountPct:
          type: integer
        ledger:
          type: array
          description: Latest 100 entries, newest first
          items:
            $ref: '#/components/schemas/LedgerEntry'

    # ---------------------------------------------------------------- admin
    Dashboard:
      type: object
      required: [date, bookingsCount, revenue, occupancyPct, showtimesCount, revenueLast7Days, showtimes]
      properties:
        date:
          type: string
          format: date
        bookingsCount:
          type: integer
          description: CONFIRMED bookings confirmed on that date (excl. walk-in)
        revenue:
          $ref: '#/components/schemas/Money'
        occupancyPct:
          type: number
          description: Sold seat units / total seat units of that date's showtimes, 0–100 (incl. walk-in)
        showtimesCount:
          type: integer
        revenueLast7Days:
          type: array
          items:
            type: object
            required: [date, revenue]
            properties:
              date:
                type: string
                format: date
              revenue:
                $ref: '#/components/schemas/Money'
        showtimes:
          type: array
          items:
            type: object
            required: [id, startsAt, movieTitle, roomName, soldSeats, totalSeats]
            properties:
              id:
                type: integer
                format: int64
              startsAt:
                type: string
                format: date-time
              movieTitle:
                type: string
              roomName:
                type: string
              soldSeats:
                type: integer
              totalSeats:
                type: integer
    TranslatedNames:
      type: object
      required: [vi]
      properties:
        vi:
          type: string
        en:
          type: [string, 'null']
    AdminGenre:
      type: object
      required: [code, names]
      properties:
        code:
          type: string
        names:
          $ref: '#/components/schemas/TranslatedNames'
    MovieTranslationInput:
      type: object
      required: [title, synopsis]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        synopsis:
          type: string
          minLength: 1
          maxLength: 4000
    AdminMovieInput:
      type: object
      required: [slug, originalTitle, durationMin, ageRating, countryCode, audioLanguage, releaseDate, status, posterUrl, genreCodes, directors, cast, translations]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 120
        originalTitle:
          type: string
          maxLength: 200
        durationMin:
          type: integer
          minimum: 30
          maximum: 300
        ageRating:
          $ref: '#/components/schemas/AgeRating'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        audioLanguage:
          type: string
          pattern: '^[a-z]{2}$'
        subtitleLanguage:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
        releaseDate:
          type: string
          format: date
        releaseOffsetDays:
          type: [integer, 'null']
          description: Coming-soon seed only; the nightly reset sets releaseDate = today + offset (BR-26)
        status:
          $ref: '#/components/schemas/MovieStatus'
        posterUrl:
          type: string
          format: uri
        backdropUrl:
          type: [string, 'null']
          format: uri
        trailerYoutubeId:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{11}$'
        genreCodes:
          type: array
          minItems: 1
          items:
            type: string
        directors:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            type: string
        translations:
          type: object
          required: [vi]
          properties:
            vi:
              $ref: '#/components/schemas/MovieTranslationInput'
            en:
              oneOf:
                - $ref: '#/components/schemas/MovieTranslationInput'
                - type: 'null'
    AdminMovie:
      allOf:
        - $ref: '#/components/schemas/AdminMovieInput'
        - type: object
          required: [id, isSeed, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            isSeed:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdminMoviePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminMovie'
    AdminRoom:
      type: object
      required: [id, name, cleanupMinutes, isActive, isSeed, singleSeats, coupleSeats, capacityPeople, blockedSeats]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        cleanupMinutes:
          type: integer
        isActive:
          type: boolean
        isSeed:
          type: boolean
        singleSeats:
          type: integer
        coupleSeats:
          type: integer
        capacityPeople:
          type: integer
        blockedSeats:
          type: integer
    AdminSeat:
      type: object
      required: [id, label, number, col, seatType, active]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        number:
          type: integer
        col:
          type: integer
        seatType:
          $ref: '#/components/schemas/SeatType'
        active:
          type: boolean
    AdminRoomDetail:
      allOf:
        - $ref: '#/components/schemas/AdminRoom'
        - type: object
          required: [columns, rows]
          properties:
            columns:
              type: integer
            rows:
              type: array
              items:
                type: object
                required: [label, seatType, seats]
                properties:
                  label:
                    type: string
                  seatType:
                    $ref: '#/components/schemas/SeatType'
                  seats:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSeat'
    AdminRoomInput:
      type: object
      required: [name, cleanupMinutes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        cleanupMinutes:
          type: integer
          minimum: 0
          maximum: 60
    RoomLayoutInput:
      type: object
      required: [singleRows, seatsPerRow, coupleSeats]
      description: Single rows A, B, … in front; one couple row at the back (BR-07)
      properties:
        singleRows:
          type: integer
          minimum: 1
          maximum: 15
        seatsPerRow:
          type: integer
          minimum: 4
          maximum: 20
        coupleSeats:
          type: integer
          minimum: 0
          maximum: 10
    SeatActiveInput:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    AdminShowtime:
      type: object
      required: [id, movie, room, startsAt, endsAt, blockedUntil, status, source, soldSeats, totalSeats]
      properties:
        id:
          type: integer
          format: int64
        movie:
          $ref: '#/components/schemas/MovieRef'
        room:
          $ref: '#/components/schemas/RoomRef'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        blockedUntil:
          type: string
          format: date-time
          description: endsAt + room cleanup (BR-22)
        status:
          type: string
          enum: [SCHEDULED, CANCELLED]
        source:
          type: string
          enum: [TEMPLATE, MANUAL]
        templateId:
          type: [integer, 'null']
          format: int64
        soldSeats:
          type: integer
        totalSeats:
          type: integer
    AdminShowtimeInput:
      type: object
      required: [movieId, roomId, startsAt]
      properties:
        movieId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
          description: Must be in the future
    CancelShowtimeResult:
      type: object
      required: [showtime, affectedBookingIds]
      properties:
        showtime:
          $ref: '#/components/schemas/AdminShowtime'
        affectedBookingIds:
          type: array
          description: CONFIRMED bookings that need a manual refund
          items:
            type: string
            format: uuid
    AdminTemplateInput:
      type: object
      required: [movieId, roomId, startTime, daysOfWeek, active]
      properties:
        movieId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time HH:mm
        daysOfWeek:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DayOfWeek'
        active:
          type: boolean
    AdminTemplate:
      allOf:
        - $ref: '#/components/schemas/AdminTemplateInput'
        - type: object
          required: [id, movieTitle, roomName, isSeed]
          properties:
            id:
              type: integer
              format: int64
            movieTitle:
              type: string
            roomName:
              type: string
            isSeed:
              type: boolean
    RegenerateResult:
      type: object
      required: [from, to, created, skippedExisting, skippedConflicts]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        created:
          type: integer
        skippedExisting:
          type: integer
        skippedConflicts:
          type: integer
          description: Template slots rejected by the overlap constraint
    PricingPolicyInput:
      type: object
      required: [discountDayOfWeek, adultDiscountDay, adultWeekday, adultWeekend, studentPrice, coupleSurcharge, pointsRatePct, vipThresholdPoints, vipSnackDiscountPct, holdMinutes]
      properties:
        effectiveFrom:
          type: [string, 'null']
          format: date-time
          description: Defaults to now; must not be in the past
        discountDayOfWeek:
          type: string
          enum: [MON, TUE, WED, THU, FRI]
        adultDiscountDay:
          $ref: '#/components/schemas/Money'
        adultWeekday:
          $ref: '#/components/schemas/Money'
        adultWeekend:
          $ref: '#/components/schemas/Money'
        studentPrice:
          $ref: '#/components/schemas/Money'
        coupleSurcharge:
          $ref: '#/components/schemas/Money'
        pointsRatePct:
          type: integer
          minimum: 0
          maximum: 100
        vipThresholdPoints:
          type: integer
          minimum: 1
        vipSnackDiscountPct:
          type: integer
          minimum: 0
          maximum: 100
        holdMinutes:
          type: integer
          minimum: 3
          maximum: 30
    PricingPolicy:
      allOf:
        - $ref: '#/components/schemas/PricingPolicyInput'
        - type: object
          required: [id, effectiveFrom, createdBy]
          properties:
            id:
              type: integer
              format: int64
            createdBy:
              type: [string, 'null']
              description: Admin email; null for the seed policy
    PricingOverview:
      type: object
      required: [current, history]
      properties:
        current:
          $ref: '#/components/schemas/PricingPolicy'
        history:
          type: array
          description: Newest first, including the current one
          items:
            $ref: '#/components/schemas/PricingPolicy'
    PricingPolicyCreated:
      type: object
      required: [policy, warnings]
      properties:
        policy:
          $ref: '#/components/schemas/PricingPolicy'
        warnings:
          type: array
          items:
            type: string
            enum: [STUDENT_PRICE_ABOVE_LOWEST_ADULT]
    SnackTranslationInput:
      type: object
      required: [name]
