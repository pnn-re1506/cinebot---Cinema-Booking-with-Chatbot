      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    AuditEntry:
      type: object
      required: [id, action, entityType, entityId, changes, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorEmail:
          type: [string, 'null']
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE, CANCEL, REFUND, REGENERATE, BLOCK, UNBLOCK]
        entityType:
          type: string
        entityId:
          type: string
        changes:
          type: object
          description: '{ field: { from, to } }'
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'
