        createdAt:
          type: string
          format: date-time
    AdminBookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminBookingItem'
    AdminPayment:
      type: object
      required: [id, provider, txnRef, amount, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        txnRef:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        providerTxnNo:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
