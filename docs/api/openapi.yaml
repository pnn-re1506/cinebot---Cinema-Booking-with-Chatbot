openapi: 3.1.0
info:
  title: CineBot API
  version: 1.0.0
  summary: Cinema booking API (web v1; reused later by the chatbot and the kiosk)
  description: |
    Contract-first API for CineBot (`docs/RULES.md` ER-24). The backend implements this file exactly;
    the frontend generates its types from it.

    Conventions (see `docs/api/README.md`):
    - Money is integer VND. Instants are ISO-8601 with offset (`+07:00`). Dates are `YYYY-MM-DD` in the cinema timezone.
    - Errors are RFC 7807 `application/problem+json` with a stable `code` (ER-05). Clients translate codes.
    - `Accept-Language: vi|en` selects translated content (fallback `vi`).
    - Booking-scoped calls accept `X-Booking-Token` **or** a bearer token of the owner / an admin.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: CineBot
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: http://localhost:5173
    description: Frontend dev server (proxies /api)

tags:
  - name: Catalogue
    description: Movies, cinema, snacks (public)
  - name: Showtimes
    description: Showtimes and seat maps (public)
  - name: Bookings
    description: Holds, snacks, customer info, tickets, lookup
  - name: Payments
    description: Payment start, VNPay callbacks, Demo Pay
  - name: Auth
    description: Register, login, refresh rotation, logout
  - name: Account
    description: Profile, my bookings, membership
  - name: Admin
    description: Admin back office (role ADMIN)

security: []

paths:
  # ------------------------------------------------------------------ Catalogue
  /api/movies:
    get:
      tags: [Catalogue]
      operationId: listMovies
      summary: List movies by status and genre
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          required: false
          description: Defaults to NOW_SHOWING. ENDED is never returned publicly.
          schema:
            type: string
            enum: [NOW_SHOWING, COMING_SOON]
            default: NOW_SHOWING
        - name: genre
          in: query
          required: false
          description: Genre code, e.g. `action`
          schema:
            type: string
      responses:
        '200':
          description: Movies ordered by release date (now showing - newest first; coming soon - soonest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieSummary'
              example:
                - id: 1
                  slug: dune-part-two
                  title: 'Dune: Hành Tinh Cát – Phần Hai'
                  originalTitle: 'Dune: Part Two'
                  status: NOW_SHOWING
                  ageRating: T13
                  durationMin: 166
                  genres:
                    - code: sci-fi
                      name: Khoa học viễn tưởng
                  countryCode: US
                  audioLanguage: en
                  subtitleLanguage: vi
                  releaseDate: '2026-10-30'
                  posterUrl: https://cdn.example.org/posters/dune2.jpg
                  backdropUrl: https://cdn.example.org/backdrops/dune2.jpg
                  trailerYoutubeId: Way9Dexny3w
                  synopsis: Paul Atreides hợp lực cùng Chani và người Fremen…
                  directors: [Denis Villeneuve]
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /api/movies/{slug}:
    get:
      tags: [Catalogue]
      operationId: getMovie
      summary: Movie detail
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Movie detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/movies/{slug}/showtimes:
    get:
      tags: [Showtimes]
      operationId: listMovieShowtimes
      summary: Showtimes of a movie for a range of days (date strip)
      description: |
        Returns one entry per day from `from` for `days` days, including days without showtimes
        (the date strip disables them). Past showtimes are omitted (BR-24). Coming-soon movies return empty days (BR-23).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Slug'
        - name: from
          in: query
          required: false
          description: First day (cinema timezone). Defaults to today; must be within the rolling window.
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 7
      responses:
        '200':
          description: Showtimes grouped by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieShowtimes'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/cinema:
    get:
      tags: [Catalogue]
      operationId: getCinema
      summary: Cinema info and rooms
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The cinema (one in v1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cinema'

  /api/snacks:
    get:
      tags: [Catalogue]
      operationId: listSnacks
      summary: Active snacks and combos, with the caller's VIP price
      description: With a bearer token of a VIP member, `discountedPrice` applies BR-19 (rounded down to 1,000 VND).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Snacks ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snack'

  # ------------------------------------------------------------------ Showtimes
  /api/showtimes/{showtimeId}:
    get:
      tags: [Showtimes]
      operationId: getShowtime
      summary: Showtime detail with that day's prices
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ShowtimeId'
      responses:
        '200':
          description: Showtime detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowtimeDetail'
              example:
                id: 4211
                status: SCHEDULED
                startsAt: '2026-11-14T19:30:00+07:00'
                endsAt: '2026-11-14T22:16:00+07:00'
                salesOpen: true
                dayType: WEEKEND
                room: { id: 1, name: Room 1 }
                movie:
                  id: 1
                  slug: dune-part-two
                  title: 'Dune: Hành Tinh Cát – Phần Hai'
                  ageRating: T13
                  durationMin: 166
                  posterUrl: https://cdn.example.org/posters/dune2.jpg
                  backdropUrl: https://cdn.example.org/backdrops/dune2.jpg
                prices: { adult: 65000, student: 45000, couple: 140000 }
                holdMinutes: 10
                maxSeatUnits: 8
        '404':
          $ref: '#/components/responses/NotFound'

  /api/showtimes/{showtimeId}/seat-map:
    get:
      tags: [Showtimes]
      operationId: getSeatMap
      summary: Seat map with live statuses
      description: |
        Status per seat (BR-07): SOLD from PostgreSQL, HELD from Redis, BLOCKED = inactive seat in the room layout.
        With `X-Booking-Token`, seats held by that booking are `HELD_BY_YOU`.
        If Redis is unavailable, `inventoryAvailable=false`: holds are unknown (never reported as HELD) and the client must disable "Continue".
        Never cached. Clients poll every 5 s while visible.
      security:
        - {}
        - bookingToken: []
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
              example:
                showtimeId: 4211
                inventoryAvailable: true
                columns: 16
                rows:
                  - label: A
                    seatType: SINGLE
                    seats:
                      - { id: 1, label: A1, number: 1, col: 0, seatType: SINGLE, status: SOLD }
                      - { id: 2, label: A2, number: 2, col: 1, seatType: SINGLE, status: AVAILABLE }
                  - label: K
                    seatType: COUPLE
                    seats:
                      - { id: 161, label: K1, number: 1, col: 0, seatType: COUPLE, status: HELD }
                      - { id: 162, label: K2, number: 2, col: 2, seatType: COUPLE, status: HELD_BY_YOU }
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ Bookings
  /api/bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Hold seats (creates a HOLDING booking)
      description: |
        Validates BR-05, BR-07, BR-08, BR-23, BR-24, holds the seats in Redis for `holdMinutes` (BR-09),
        snapshots prices (BR-04) and releases the owner's previous hold (BR-10).
        The owner is the member (bearer token) or, for guests, `X-Client-Id`.
        `bookingToken` is returned **only here**; the client stores it for booking-scoped calls.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              showtimeId: 4211
              quantities: { adult: 1, student: 1, couple: 0 }
              seatIds: [57, 58]
      responses:
        '201':
          description: Seats held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SEAT_UNAVAILABLE` (seatIds lists the taken seats)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: SEAT_UNAVAILABLE
                seatIds: [58]
        '422':
          description: '`ORPHAN_SEAT` (seatIds lists the orphan seats), `TICKET_COUNT_MISMATCH`, `BOOKING_TOO_LARGE`, `SALES_CLOSED`, `NOT_BOOKABLE`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                code: ORPHAN_SEAT
                seatIds: [56]
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SeatServiceUnavailable'

  /api/bookings/{bookingId}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Booking detail (status polling on the result page)
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Bookings]
      operationId: releaseBooking
      summary: Release the hold (customer goes back to the seat map)
      description: Only in `HOLDING` (→ `RELEASED`, BR-10). Releasing an already released or expired booking is a no-op (204).
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Released
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/bookings/{bookingId}/snacks:
    put:
      tags: [Bookings]
      operationId: replaceBookingSnacks
      summary: Replace the snack lines of a booking
      description: Only in `HOLDING`. An empty list removes all snacks. VIP discount is evaluated now and snapshotted (BR-19).
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSnacksRequest'
      responses:
        '200':
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '410':
          $ref: '#/components/responses/HoldExpired'

  /api/bookings/{bookingId}/customer:
    put:
      tags: [Bookings]
      operationId: setBookingCustomer
      summary: Set contact details for this booking
      description: Only in `HOLDING`. Required for guests before payment; members may override their profile values for this booking (BR-20).
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '410':
          $ref: '#/components/responses/HoldExpired'

  /api/bookings/{bookingId}/payments:
    post:
      tags: [Payments]
      operationId: startPayment
      summary: Start a payment attempt
      description: |
        Only in `HOLDING`. Extends the Redis hold by the 2-minute grace (BR-11); if the hold was lost → 410.
        Creates a payment `INITIATED` with a new `txnRef` and moves the booking to `PENDING_PAYMENT`.
        Guests must have set customer info first (`CUSTOMER_INFO_REQUIRED`). Members default to their profile.
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        '201':
          description: Payment created; redirect the browser to `redirectUrl`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInit'
              example:
                paymentId: 901
                provider: MOCK
                redirectUrl: /pay/mock/901
                expiresAt: '2026-11-14T19:12:00+07:00'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '410':
          $ref: '#/components/responses/HoldExpired'
        '422':
          description: '`CUSTOMER_INFO_REQUIRED`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/SeatServiceUnavailable'

  /api/bookings/{bookingId}/tickets:
    get:
      tags: [Bookings]
      operationId: getBookingTickets
      summary: Tickets of a confirmed booking
      description: One ticket per seat unit; a couple seat is one ticket with `admits = 2` (D-019). Not `CONFIRMED` → 409 `INVALID_STATE`.
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/bookings/lookup:
    post:
      tags: [Bookings]
      operationId: lookupBooking
      summary: Find a booking by code plus email or phone (guests)
      description: |
        BR-21. Max 5 attempts per minute per IP (429). Wrong code or contact → 404 (never reveals which part was wrong).
        Only `CONFIRMED`, `NEEDS_ATTENTION` and `REFUNDED` bookings are found. The phone in the response is masked (ER-15).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
            example:
              code: 7K3QH9TD
              contact: '0901234567'
      responses:
        '200':
          description: Booking and its tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ------------------------------------------------------------------ Payments
  /api/payments/vnpay/ipn:
    get:
      tags: [Payments]
      operationId: vnpayIpn
      summary: VNPay IPN (server to server)
      description: |
        Verifies the HMAC-SHA512 checksum and the amount (`vnp_Amount = total × 100`), then runs `confirmPaid` (idempotent, BR-13/BR-14).
        Always HTTP 200 with VNPay's `RspCode`: `00` ok, `01` order not found, `02` already confirmed, `04` invalid amount, `97` invalid checksum, `99` other.
      parameters:
        - name: params
          in: query
          required: true
          description: All `vnp_*` parameters sent by VNPay
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: VNPay acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VnpayIpnAck'
              example:
                RspCode: '00'
                Message: Confirm Success

  /api/payments/vnpay/return:
    get:
      tags: [Payments]
      operationId: vnpayReturn
      summary: VNPay browser return
      description: Verifies the checksum and redirects to `/checkout/{bookingId}/result`. **Never confirms** a booking (BR-13).
      parameters:
        - name: params
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '302':
          description: Redirect to the frontend result page
          headers:
            Location:
              schema:
                type: string

  /api/payments/mock/{paymentId}:
    get:
      tags: [Payments]
      operationId: getMockPayment
      summary: Demo Pay page data
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment info for the Demo Pay page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockPaymentInfo'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Payments]
      operationId: completeMockPayment
      summary: Complete a Demo Pay payment
      description: |
        `SUCCESS` runs the same confirmation path as a VNPay IPN (`confirmPaid`). `FAILURE` marks the payment `FAILED`
        and returns the booking to `HOLDING` while the hold is valid (BR-13). Idempotent for an already completed payment.
      security:
        - bookingToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentOutcome'
      responses:
        '200':
          description: Booking after processing (CONFIRMED, NEEDS_ATTENTION or HOLDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  # ------------------------------------------------------------------ Auth
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a member account and log in
      description: Sets the refresh cookie (`Set-Cookie`, see `refreshCookie`).
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: '`EMAIL_TAKEN`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (creates a new refresh-token family)
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: '`INVALID_CREDENTIALS`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      description: |
        Rotation with reuse detection (`ARCHITECTURE.md` §7.2). A reused token within 10 s returns the existing successor;
        after the grace window the whole family is revoked and `TOKEN_REUSED` is returned.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          description: '`UNAUTHENTICATED` (missing/expired/unknown) or `TOKEN_REUSED`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh-token family and clear the cookie
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: Logged out (also when the cookie was missing)

  # ------------------------------------------------------------------ Account
  /api/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Current member profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [Account]
      operationId: updateMe
      summary: Update profile (email is read-only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/me/bookings:
    get:
      tags: [Account]
      operationId: listMyBookings
      summary: My bookings (CONFIRMED, NEEDS_ATTENTION, REFUNDED)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: scope
          in: query
          required: false
