        sortOrder:
          type: integer
        translations:
          type: object
          required: [vi]
          properties:
            vi:
              $ref: '#/components/schemas/SnackTranslationInput'
            en:
              oneOf:
                - $ref: '#/components/schemas/SnackTranslationInput'
                - type: 'null'
    AdminSnack:
